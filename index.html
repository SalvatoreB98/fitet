      <h2>Cosa puoi trovare nel Portale Risultati:</h2>
      <ul>
        <li><strong>Classifiche Campionati a Squadre</strong>: punti, partite vinte, pareggiate, perse e stato forma
          delle squadre.</li>
        <li><strong>Calendario Incontri e Referti</strong>: dettagli completi delle singole partite individuali e dei
          set disputati.</li>
        <li><strong>Schede Ranking Atleti</strong>: punteggio FITeT, posizione nazionale, categoria, storico classifica
          e confronti testa a testa.</li>
